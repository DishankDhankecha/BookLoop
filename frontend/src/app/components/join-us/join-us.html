<section class="bg-primary border-b  border-indigo/10 w-full py-30 md:py-48 top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="flex flex-col max-w-4xl m-auto gap-4 md:gap-6">
            <h2 class="text-text-primary text-center text-5xl md:text-8xl italic font-serif font-light leading-none">
                Your Next chapter <span>awaits</span> 
            </h2>
            <p class="text-xl md:text-2xl text-text-primary/70 font-extralight mb-12 text-center leading-relaxed italic ">Join the cycle of knowledge today</p>
            <div class="flex flex-col md:flex-row justify-center items-center gap-4 md:gap-6">
                <a [routerLink]="isLoggedIn() ? ['/dashboard'] : ['/login']" class="bg-text-primary text-primary px-12 py-5 text-sm uppercase text-center tracking-[0.3em] font-bold hover:bg-secondary hover:text-text-primary transition-all w-full md:w-auto">Begin The Exchange</a>
                <a [routerLink]="isLoggedIn() ? ['/browse'] : ['/login']" class="text-text-primary text-xs uppercase text-center tracking-widest font-bold border-b border-text-primary pb-1 hover:border-secondary hover:text-secondary transition-all w-full md:w-auto">View The Collection</a>
            </div>
        </div>
    </div>
</section>
